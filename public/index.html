}

// ── Versioning ────────────────────────────────────
function hasVersions(sec) {
  return sec.versions && sec.versions.length > 1;
}

function getActiveVersion(sec) {
  if (!sec.versions || !sec.versions.length) return null;
  return sec.versions[sec.activeVersion || 0];
}

function getCurrentLines() {
  const sec = sections[current];
  if (hasVersions(sec)) {
    const v = getActiveVersion(sec);
    return { lines: v.lines, sources: v.sources };
  }
  return { lines: sec.lines, sources: sec.sources };
}

function setCurrentLines(lines, sources) {
  const sec = sections[current];
  if (hasVersions(sec)) {
    const v = getActiveVersion(sec);
    v.lines = lines;
    v.sources = sources;
  } else {
    sec.lines = lines;
    sec.sources = sources;
  }
}

function renderVersionTabs() {
  const sec = sections[current];
  const controls = document.getElementById('versionControls');
  const tabs = document.getElementById('versionTabs');
  const forkBtn = document.getElementById('forkBtn');
  
  if (!hasVersions(sec)) {
    controls.style.display = 'none';
    forkBtn.classList.remove('hidden');
    return;
  }
  
  controls.style.display = 'flex';
  forkBtn.classList.add('hidden');
  tabs.innerHTML = '';
  
  sec.versions.forEach((v, i) => {
    const tab = document.createElement('button');
    tab.className = 'version-tab' + (i === (sec.activeVersion || 0) ? ' active' : '');
    tab.textContent = v.name || String.fromCharCode(65 + i); // A, B, C...
    tab.onclick = () => switchVersion(i);
    tabs.appendChild(tab);
  });
}

function forkVersion() {
  const sec = sections[current];
  
  // Convert to versioned format if not already
  if (!sec.versions) {
    sec.versions = [{
      name: 'A',
      lines: [...sec.lines],
      sources: [...(sec.sources || sec.lines.map(() => 'human'))]
    }];
  }
  
  // Create new version as copy of current
  const currentV = sec.versions[sec.activeVersion || 0];
  const newName = String.fromCharCode(65 + sec.versions.length); // Next letter
  sec.versions.push({
    name: newName,
    lines: [...currentV.lines],
    sources: [...currentV.sources]
  });
  
  // Switch to new version
  sec.activeVersion = sec.versions.length - 1;
  renderVersionTabs();
  renderEditor();
  renderSidebar();
}

function addVersion() {
  forkVersion();
}

function switchVersion(idx) {
  const sec = sections[current];
  if (!sec.versions || idx >= sec.versions.length) return;
  sec.activeVersion = idx;
  renderVersionTabs();
  renderEditor();
  renderOverview();
}

function deleteVersion(idx) {
  const sec = sections[current];
  if (!sec.versions || sec.versions.length <= 1) return;
  
  sec.versions.splice(idx, 1);
  if (sec.activeVersion >= sec.versions.length) {
    sec.activeVersion = sec.versions.length - 1;
  }
  
  // If only one version left, convert back to simple format
  if (sec.versions.length === 1) {
    sec.lines = sec.versions[0].lines;
    sec.sources = sec.versions[0].sources;
    delete sec.versions;
    delete sec.activeVersion;
  }
  
  renderVersionTabs();
  renderEditor();
  renderSidebar();
}

let compareOpen = false;

function toggleVersionCompare() {
  const sec = sections[current];
  if (!hasVersions(sec)) return;
  
  compareOpen = !compareOpen;
  const panel = document.getElementById('versionComparePanel');
  const btn = document.getElementById('versionCompareBtn');
  
  if (compareOpen) {
    panel.classList.add('open');
    btn.classList.add('active');
    renderVersionCompare();
  } else {
    closeVersionCompare();
  }
}

function closeVersionCompare() {
  compareOpen = false;
  document.getElementById('versionComparePanel').classList.remove('open');
  document.getElementById('versionCompareBtn')?.classList.remove('active');
}

function renderVersionCompare() {
  const sec = sections[current];
  if (!hasVersions(sec)) return;
  
  const title = document.getElementById('compareTitle');
  title.textContent = `${sec.name} — Compare Versions`;
  
  const body = document.getElementById('compareBody');
  body.innerHTML = '';
  
  // Show all versions side by side
  sec.versions.forEach((v, vi) => {
    const col = document.createElement('div');
    col.className = 'compare-column';
    
    const header = document.createElement('div');
    header.className = 'compare-version-header';
    header.innerHTML = `Version ${v.name || String.fromCharCode(65 + vi)}`;
    if (vi === (sec.activeVersion || 0)) {
      header.innerHTML += ' <span style="color:var(--amber)">(active)</span>';
    }
    col.appendChild(header);
    
    // Find max lines across all versions for alignment
    const maxLines = Math.max(...sec.versions.map(ver => ver.lines.length));
    
    for (let i = 0; i < maxLines; i++) {
      const line = v.lines[i] || '';
      const div = document.createElement('div');
      div.className = 'compare-line';
      
      if (!line.trim()) {
        div.classList.add('empty');
        div.textContent = '—';
      } else {
        // Check if this line differs from other versions
        const differs = sec.versions.some((otherV, ovi) => {
          if (ovi === vi) return false;
          return (otherV.lines[i] || '') !== line;
        });
        if (differs) div.classList.add('diff');
        div.textContent = line;
      }
      
      col.appendChild(div);
    }
    
    // Add "Use this version" button
    const useBtn = document.createElement('button');
    useBtn.style.cssText = 'margin-top:16px;padding:8px 16px;background:var(--ink);color:var(--cream);border:none;border-radius:6px;font-size:12px;cursor:pointer;width:100%;';

// ── Editor ────────────────────────────────────────
function renderEditor() {
  const editor = document.getElementById('lyricEditor');
  const sec = sections[current];
  
  // Get lines from active version if versioned
  let lines, sources;
  if (hasVersions(sec)) {
    const v = getActiveVersion(sec);
    lines = v.lines;
    sources = v.sources || v.lines.map(() => 'human');
  } else {
    lines = sec.lines;
    sources = sec.sources || sec.lines.map(() => 'human');
    if (!sec.sources) sec.sources = sources;
  }
  
  editor.innerHTML = '';

  lines.forEach((text, i) => {
    const isAI = sources[i] === 'ai';

    const row = document.createElement('div');
    row.className = 'lyric-line';
    row.id = `row${i}`;

    const num = document.createElement('div');
    num.className = 'line-num';
    num.textContent = i + 1;

    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'line-input' + (isAI ? ' ai-line' : '');
    input.value = text;
    input.placeholder = i === 0 ? t('editor.placeholder.0') : i === 1 ? t('editor.placeholder.1') : '';
    input.dataset.idx = i;

    // When the user edits an AI line, it becomes human
    input.addEventListener('keypress', () => {
      if (sources[i] === 'ai') {
        sources[i] = 'human';
        input.classList.remove('ai-line');
        const badge = document.getElementById(`badge${i}`);
        if (badge) badge.textContent = '';
      }
    });

    // AI badge (✦ for AI lines)
    const badge = document.createElement('div');
    badge.className = 'ai-badge';
    badge.id = `badge${i}`;
    badge.textContent = isAI ? '✦' : '';

    const syl = document.createElement('div');
    syl.className = 'syl-count' + (text ? ' filled' : '');
    syl.id = `syl${i}`;
    syl.textContent = text ? countSyl(text) : '';

    input.addEventListener('focus', () => {
      selectedLine = i;
      document.querySelectorAll('.lyric-line').forEach((r, j) =>
        r.classList.toggle('focused', j === i));
    });

    let snapTimer = null;
    input.addEventListener('input', e => {
      // Debounced snapshot for typing (every 1s of inactivity)
      clearTimeout(snapTimer);
      snapTimer = setTimeout(() => snapshot(), 1000);
      lines[i] = e.target.value;
      const n = e.target.value ? countSyl(e.target.value) : '';
      syl.textContent = n;
      syl.className = 'syl-count' + (e.target.value ? ' filled' : '');
      updateLineCounts();
      renderOverview();
    });

    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        snapshot();
        lines.splice(i + 1, 0, '');
        sources.splice(i + 1, 0, 'human');
        renderEditor();
        focusLine(i + 1);
      } else if (e.key === 'Backspace' && !e.target.value && lines.length > 1) {
        snapshot();
        lines.splice(i, 1);
        sources.splice(i, 1);
        renderEditor();
        focusLine(Math.max(0, i - 1));
      }
    });

    // Move up / down arrows
    const arrows = document.createElement('div');
    arrows.className = 'line-move-arrows';

    const upBtn = document.createElement('button');
    upBtn.className = 'move-arrow';
    upBtn.textContent = '▲';
    upBtn.title = 'Move line up';
    upBtn.addEventListener('click', () => moveLine(i, -1));

    const dnBtn = document.createElement('button');
    dnBtn.className = 'move-arrow';
    dnBtn.textContent = '▼';
    dnBtn.title = 'Move line down';
    dnBtn.addEventListener('click', () => moveLine(i, 1));

    if (i > 0) arrows.appendChild(upBtn);
    if (i < sec.lines.length - 1) arrows.appendChild(dnBtn);

    row.appendChild(num);
    row.appendChild(input);
    row.appendChild(arrows);
    row.appendChild(badge);
    row.appendChild(syl);
    editor.appendChild(row);
  });
}

function focusLine(idx) {
  setTimeout(() => {
    const inputs = document.querySelectorAll('.line-input');
    if (inputs[idx]) { inputs[idx].focus(); selectedLine = idx; }
  }, 0);
}

function moveLine(idx, dir) {
  const sec = sections[current];
  const newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= sec.lines.length) return;
  snapshot();
  // Swap lines
  [sec.lines[idx], sec.lines[newIdx]] = [sec.lines[newIdx], sec.lines[idx]];
  if (sec.sources) [sec.sources[idx], sec.sources[newIdx]] = [sec.sources[newIdx], sec.sources[idx]];
  renderEditor();
  focusLine(newIdx);
  renderOverview();
}

// ── Syllable counter (English) ────────────────────
function countSyl(str) {
  let total = 0;
  for (const w of str.toLowerCase().split(/\s+/)) {
    const clean = w.replace(/[^a-z]/g, '');
    if (!clean) continue;
    if (clean.length <= 2) { total += 1; continue; }
    let s = clean.replace(/(?:[^laeiouy]es|ed|[^laeiouy]e)$/, '');
    s = s.replace(/^y/, '');
    const m = s.match(/[aeiouy]{1,2}/g);
    total += m ? m.length : 1;
  }
  return total || 1;
}

// ── Split resizer drag ────────────────────────────
(function initSplitResizer() {
  let dragging = false;
  let startX = 0;
  let startOvW = 0;

  document.addEventListener('DOMContentLoaded', () => {
    const resizer = document.getElementById('splitResizer');
    const ov = document.getElementById('songOverview');
    const wrap = document.getElementById('canvasWrap');

    resizer.addEventListener('mousedown', e => {
      if (!splitOpen) return;
      dragging = true;
      startX = e.clientX;
      startOvW = ov.offsetWidth;
      resizer.classList.add('dragging');
      document.body.style.cursor = 'col-resize';
      document.body.style.userSelect = 'none';
      e.preventDefault();
    });

    document.addEventListener('mousemove', e => {
      if (!dragging) return;
      const dx = startX - e.clientX; // dragging left = overview gets bigger
      const newW = Math.max(120, Math.min(wrap.offsetWidth * 0.7, startOvW + dx));
      ov.style.width = newW + 'px';
    });

    document.addEventListener('mouseup', () => {
      if (dragging) {
        dragging = false;
        resizer.classList.remove('dragging');
        document.body.style.cursor = '';
        document.body.style.userSelect = '';
      }
    });
  });
})();

    const words = (line || '').toLowerCase().replace(/[^a-z\s]/g, '').split(/\s+/).filter(w => w.length > 2 && !stopwords.includes(w));
    const keyword = words[words.length - 1] || words[0] || 'love';

  if (mode === 'specific') {
    const card = document.createElement('div');
    card.className = 'specificity-card';
    card.innerHTML = `<div class="spec-label">✦ Get Specific</div>`;
    text.split('\n').filter(l => l.trim()).forEach(q => {
      const clean = q.replace(/^\d+\.\s*/, '').trim();
      if (!clean) return;
      const p = document.createElement('div');
      p.className = 'spec-question';
      p.textContent = clean;
      card.appendChild(p);
    });
    container.appendChild(card);
    return;
  }

  // prose modes — no "Use this" button, just readable cards
  if (mode === 'perspective' || mode === 'metaphor' || mode === 'bridge') {
    const card = document.createElement('div');
    card.className = 'specificity-card';
    card.style.borderColor = 'var(--ink-mid)';
    card.style.background = 'var(--cream)';
    const lbl = document.createElement('div');
    lbl.className = 'spec-label';
    lbl.style.color = 'var(--ink-mid)';
    lbl.textContent = mode === 'perspective' ? '◈ Perspectives' : mode === 'metaphor' ? '◎ Metaphors' : '⤷ Bridge ideas';
    card.appendChild(lbl);
    text.split('\n').filter(l => l.trim()).forEach(q => {
      const p = document.createElement('div');
      p.className = 'spec-question';
      p.style.fontStyle = 'normal';
      p.style.fontSize = '14px';
      p.textContent = q;
      card.appendChild(p);
    });
    container.appendChild(card);
    return;
  }

  // match + unstuck + rewrite + prosody + hook — show as usable suggestion cards
  text.split('\n').filter(l => l.trim()).forEach(line => {
    const clean = line.replace(/^\d+\.\s*/, '').trim();
    if (!clean) return;
    const card = document.createElement('div');
    card.className = 'ai-suggestion';
    const textDiv = document.createElement('div');
    textDiv.className = 'ai-suggestion-text';
    textDiv.textContent = clean;
    const meta = document.createElement('div');
    meta.className = 'ai-suggestion-meta';
    meta.textContent = `${countSyl(clean)} syllables`;
    
    // Collect button
    const collectBtn = document.createElement('button');
    collectBtn.className = 'collect-btn' + (isCollected(clean) ? ' collected' : '');
    collectBtn.textContent = '⭐';
    collectBtn.title = isCollected(clean) ? 'Already collected' : 'Add to scratch pad';
    collectBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleCollect(clean);
      collectBtn.classList.toggle('collected');
      collectBtn.title = collectBtn.classList.contains('collected') ? 'Already collected' : 'Add to scratch pad';
    });
    meta.appendChild(collectBtn);
    
    const btn = document.createElement('button');
    btn.className = 'use-btn';
    btn.textContent = t('modal.use.btn') + ' ↑';
    btn.addEventListener('click', () => useSuggestion(clean));
    meta.appendChild(btn);
    card.appendChild(textDiv);
    card.appendChild(meta);
    container.appendChild(card);
  });
}

function useSuggestion(text) {
  if (selectedLine === null) {
    alert(t('modal.use.alert'));
    return;
  }
  showUseModal(text);
}

function showUseModal(text) {
  // capture selectedLine at modal-open time
  const targetLine = selectedLine;

  document.getElementById('useModal')?.remove();

  const modal = document.createElement('div');
  modal.id = 'useModal';
  modal.style.cssText = `
    position:fixed; inset:0; z-index:10000;
    display:flex; align-items:center; justify-content:center;
    background:rgba(26,21,16,0.45); backdrop-filter:blur(3px);
  `;

  box.style.cssText = `

    border-radius:12px; padding:22px 24px; max-width:400px; width:90%;
    box-shadow:0 20px 60px rgba(26,21,16,0.25);

  // Label
  const lbl = document.createElement('div');
  lbl.style.cssText = `font-family:'Cormorant Garamond',serif; font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:10px;`;

  // Preview
  const preview = document.createElement('div');
  preview.style.cssText = `font-family:'Crimson Pro',serif; font-size:20px; color:var(--ink); margin-bottom:18px; line-height:1.4; font-style:italic;`;
  preview.textContent = text;

  // Buttons row
  const row = document.createElement('div');
  row.style.cssText = `display:flex; gap:8px; flex-wrap:wrap;`;

  const mkBtn = (label, primary) => {
    const b = document.createElement('button');
    b.textContent = label;
    b.style.cssText = primary
      ? `flex:1; padding:10px; background:var(--ink); color:var(--cream); border:none; border-radius:7px; font-family:'DM Sans',sans-serif; font-size:13px; cursor:pointer;`
      : `flex:1; padding:10px; background:var(--cream); border:1px solid var(--rule); border-radius:7px; font-family:'DM Sans',sans-serif; font-size:13px; color:var(--ink-mid); cursor:pointer;`;
    if (primary) {
      b.addEventListener('mouseenter', () => b.style.background = 'var(--amber)');
      b.addEventListener('mouseleave', () => b.style.background = 'var(--ink)');
    } else {
      b.addEventListener('mouseenter', () => b.style.borderColor = 'var(--amber)');
      b.addEventListener('mouseleave', () => b.style.borderColor = 'var(--rule)');
    }
    return b;
  };

  const replaceBtn = mkBtn(t('modal.use.replace') + ` ${targetLine + 1}`, true);
  replaceBtn.addEventListener('click', () => {
    applySuggestion('replace', text, targetLine);
    modal.remove();
  });

  const belowBtn = mkBtn(t('modal.use.below'), false);
  belowBtn.addEventListener('click', () => {
    applySuggestion('below', text, targetLine);
    modal.remove();
  });

  const cancelBtn = document.createElement('button');
  cancelBtn.textContent = t('modal.use.cancel');
  cancelBtn.style.cssText = `padding:10px 14px; background:none; border:none; color:var(--ink-faint); cursor:pointer; font-size:13px; font-family:'DM Sans',sans-serif;`;
  cancelBtn.addEventListener('click', () => modal.remove());

  row.appendChild(replaceBtn);
  row.appendChild(belowBtn);
  row.appendChild(cancelBtn);
  box.appendChild(lbl);
  box.appendChild(preview);
  box.appendChild(row);

  // Animation keyframe (once)
  if (!document.getElementById('modalStyle')) {
    const s = document.createElement('style');
    s.id = 'modalStyle';
    s.textContent = `@keyframes modalIn { from{opacity:0;transform:scale(0.92) translateY(8px)} to{opacity:1;transform:scale(1) translateY(0)} }`;
    document.head.appendChild(s);
  }

  modal.appendChild(box);
  modal.addEventListener('click', e => { if (e.target === modal) modal.remove(); });
  document.body.appendChild(modal);
}

function applySuggestion(mode, text, lineIdx) {
  snapshot();
  const sec = sections[current];
  if (!sec.sources) sec.sources = sec.lines.map(() => 'human');

  if (mode === 'replace') {
    sec.lines[lineIdx] = text;
    sec.sources[lineIdx] = 'ai';
    renderEditor();
    focusLine(lineIdx);
  } else {
    sec.lines.splice(lineIdx + 1, 0, text);
    sec.sources.splice(lineIdx + 1, 0, 'ai');
    renderEditor();
    focusLine(lineIdx + 1);
  }
  updateLineCounts();
  renderOverview();
}

let wordFamilyData = { primary: [], extended: [], intensifiers: [] };
let wordFamilyFilter = 'all';
let currentFamilyWord = '';

async function runWordFamily(word) {
  currentFamilyWord = word;
  wordFamilyFilter = 'all';
  
  const container = document.getElementById('aiResponse');
  container.innerHTML = `
    <div class="wordfamily-browser">
      <div class="wordfamily-header">
        <span class="wordfamily-word">◈ ${t('tool.wordfamily.label')}: <strong>${word}</strong></span>
      </div>
      <div class="wordfamily-filters">
        <button class="wf-filter active" data-cat="all">${t('wordfamily.all')}</button>
        <button class="wf-filter" data-cat="primary">${t('wordfamily.primary')}</button>
        <button class="wf-filter" data-cat="extended">${t('wordfamily.extended')}</button>
        <button class="wf-filter" data-cat="intensifiers">${t('wordfamily.intensifiers')}</button>
      </div>
      <div class="rhyme-loading"><span></span><span></span><span></span></div>
      <div class="wordfamily-results" id="wordfamilyResults"></div>
    </div>
  `;
  
  // Attach filter handlers
  container.querySelectorAll('.wf-filter').forEach(btn => {
    btn.onclick = () => {
      container.querySelectorAll('.wf-filter').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      wordFamilyFilter = btn.dataset.cat;
      renderWordFamilyResults();
    };
  });
  
  // Fetch from AI
  const lang = typeof currentLang === 'function' ? currentLang() : 'en';
  const langInstruction = lang === 'fr' ? ' Réponds entièrement en français.' : '';
  
  try {
    const res = await fetch('/.netlify/functions/ai', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'gpt-4o-mini',
        messages: [{
          role: 'system',
          content: 'You are a creative writing assistant specializing in vocabulary expansion for songwriters.' + langInstruction
        }, {
          role: 'user',
          content: `For the word "${word}", provide creative replacements in three categories. Return ONLY valid JSON, no markdown:

{
  "primary": ["word1", "word2", "word3", "word4", "word5"],
  "extended": ["word1", "word2", "word3", "word4", "word5"],
  "intensifiers": {
    "stronger": ["word1", "word2", "word3"],
    "softer": ["word1", "word2", "word3"]
  }
}

PRIMARY: 5 close synonyms that could replace the word in most contexts.
EXTENDED: 5 unexpected, creative replacements — not exact synonyms, but words that could replace the original MORE VIVIDLY or POETICALLY. Think metaphorical, evocative, or surprising choices.
INTENSIFIERS: 3 stronger versions (more intense emotion) and 3 softer versions (gentler, subtler).

Be creative with EXTENDED — these should surprise and inspire a songwriter.`
        }],
        max_tokens: 400,
        temperature: 0.9
      })
    });
    
    const data = await res.json();
    const text = data.choices?.[0]?.message?.content || '{}';
    
    // Parse JSON
    const jsonMatch = text.match(/\{[\s\S]*\}/);
    if (jsonMatch) {
      const parsed = JSON.parse(jsonMatch[0]);
      wordFamilyData.primary = (parsed.primary || []).map(w => ({ word: w, category: 'primary' }));
      wordFamilyData.extended = (parsed.extended || []).map(w => ({ word: w, category: 'extended' }));
      
      const stronger = (parsed.intensifiers?.stronger || []).map(w => ({ word: w, category: 'stronger' }));
      const softer = (parsed.intensifiers?.softer || []).map(w => ({ word: w, category: 'softer' }));
      wordFamilyData.intensifiers = [...stronger, ...softer];
    }
    
    container.querySelector('.rhyme-loading').style.display = 'none';
    renderWordFamilyResults();
    
  } catch (err) {
    container.querySelector('.rhyme-loading').innerHTML = 
      `<span style="color:var(--ink-faint);font-size:13px;">Could not load word family. Try again.</span>`;
  }
}

function renderWordFamilyResults() {
  const container = document.getElementById('wordfamilyResults');
  if (!container) return;
  
  container.innerHTML = '';
  
  const categories = wordFamilyFilter === 'all' 
    ? ['primary', 'extended', 'intensifiers']
    : [wordFamilyFilter];
  
  categories.forEach(cat => {
    const data = wordFamilyData[cat] || [];
    if (!data.length) return;
    
    const section = document.createElement('div');
    section.className = 'wf-section';
    
    const label = document.createElement('div');
    label.className = 'wf-section-label';
    label.textContent = t('wordfamily.' + cat);
    section.appendChild(label);
    
    const grid = document.createElement('div');
    grid.className = 'wf-grid';
    
    data.forEach(item => {
      const tag = document.createElement('div');
      tag.className = 'wf-tag ' + (item.category || cat);
      tag.innerHTML = `
        <span class="wf-word">${item.word}</span>
        <span class="wf-badge">${item.category === 'stronger' ? '↑' : item.category === 'softer' ? '↓' : ''}</span>
      `;
      tag.onclick = () => insertWordAtCursor(item.word);
      tag.oncontextmenu = (e) => {
        e.preventDefault();
        addToScratchPad(item.word);
        tag.classList.add('collected');
        setTimeout(() => tag.classList.remove('collected'), 600);
      };
      grid.appendChild(tag);
    });
    
    section.appendChild(grid);
    container.appendChild(section);
  });
  
  if (container.children.length === 0) {
    container.innerHTML = `<div class="rhyme-empty">${t('wordfamily.empty')}</div>`;
  }
}

function insertWordAtCursor(word) {
  if (selectedLine === null) return;
  const input = document.querySelectorAll('.line-input')[selectedLine];
  if (!input) return;
  
  // Insert at cursor position or end
  const start = input.selectionStart || input.value.length;
  const before = input.value.slice(0, start);
  const after = input.value.slice(start);
  
  // Add space if needed
  const needsSpaceBefore = before.length > 0 && !before.endsWith(' ');
  const needsSpaceAfter = after.length > 0 && !after.startsWith(' ');
  
  input.value = before + (needsSpaceBefore ? ' ' : '') + word + (needsSpaceAfter ? ' ' : '') + after;
  
  // Update data
  const sec = sections[current];
  let lines = hasVersions(sec) ? getActiveVersion(sec).lines : sec.lines;
  lines[selectedLine] = input.value;
  
  input.focus();
  updateLineCounts();
  renderOverview();
}

let rhymeData = { perfect: [], near: [], all: [] };
let rhymeFilters = { type: 'all', syllables: 0 };
let currentRhymeWord = '';

async function runRhymeBrowser(word) {
  currentRhymeWord = word;
  rhymeFilters = { type: 'all', syllables: 0 };
  
  const container = document.getElementById('aiResponse');
  container.innerHTML = `
    <div class="rhyme-browser">
      <div class="rhyme-header">
        <span class="rhyme-word">∿ ${t('tool.rhyme.label')}: <strong>${word}</strong></span>
      </div>
      <div class="rhyme-filters">
        <div class="rhyme-filter-group">
          <button class="rhyme-filter active" data-type="all">${t('rhyme.all')}</button>
          <button class="rhyme-filter" data-type="perfect">${t('rhyme.perfect')}</button>
          <button class="rhyme-filter" data-type="near">${t('rhyme.near')}</button>
        </div>
        <div class="rhyme-filter-group">
          <button class="rhyme-syl-btn active" data-syl="0">${t('rhyme.anysyl')}</button>
          <button class="rhyme-syl-btn" data-syl="1">1</button>
          <button class="rhyme-syl-btn" data-syl="2">2</button>
          <button class="rhyme-syl-btn" data-syl="3">3</button>
          <button class="rhyme-syl-btn" data-syl="4">4+</button>
        </div>
      </div>
      <div class="rhyme-loading"><span></span><span></span><span></span></div>
      <div class="rhyme-results" id="rhymeResults"></div>
    </div>
  `;
  
  // Attach filter handlers
  container.querySelectorAll('.rhyme-filter').forEach(btn => {
    btn.onclick = () => {
      container.querySelectorAll('.rhyme-filter').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      rhymeFilters.type = btn.dataset.type;
      renderRhymeResults();
    };
  });
  
  container.querySelectorAll('.rhyme-syl-btn').forEach(btn => {
    btn.onclick = () => {
      container.querySelectorAll('.rhyme-syl-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      rhymeFilters.syllables = parseInt(btn.dataset.syl);
      renderRhymeResults();
    };
  });
  
  // Fetch from Datamuse API
  try {
    const [perfectRes, nearRes] = await Promise.all([
      fetch(`https://api.datamuse.com/words?rel_rhy=${encodeURIComponent(word)}&max=50&md=s`),
      fetch(`https://api.datamuse.com/words?rel_nry=${encodeURIComponent(word)}&max=50&md=s`)
    ]);
    
    const perfectData = await perfectRes.json();
    const nearData = await nearRes.json();
    
    // Parse results with syllable counts
    rhymeData.perfect = perfectData.map(r => ({
      word: r.word,
      syllables: r.numSyllables || countSyl(r.word),
      score: r.score || 0
    }));
    
    rhymeData.near = nearData.map(r => ({
      word: r.word,
      syllables: r.numSyllables || countSyl(r.word),
      score: r.score || 0
    }));
    
    // Combine for "all" view, removing duplicates
    const seen = new Set();
    rhymeData.all = [];
    [...rhymeData.perfect, ...rhymeData.near].forEach(r => {
      if (!seen.has(r.word)) {
        seen.add(r.word);
        rhymeData.all.push(r);
      }
    });
    
    // Sort by score
    rhymeData.all.sort((a, b) => b.score - a.score);
    
    container.querySelector('.rhyme-loading').style.display = 'none';
    renderRhymeResults();
    
  } catch (err) {
    container.querySelector('.rhyme-loading').innerHTML = 
      `<span style="color:var(--ink-faint);font-size:13px;">Could not load rhymes. Try again.</span>`;
  }
}

function renderRhymeResults() {
  const container = document.getElementById('rhymeResults');
  if (!container) return;
  
  let data = rhymeData[rhymeFilters.type] || rhymeData.all;
  
  // Filter by syllables
  if (rhymeFilters.syllables > 0) {
    if (rhymeFilters.syllables === 4) {
      data = data.filter(r => r.syllables >= 4);
    } else {
      data = data.filter(r => r.syllables === rhymeFilters.syllables);
    }
  }
  
  if (data.length === 0) {
    container.innerHTML = `<div class="rhyme-empty">${t('rhyme.none')}</div>`;
    return;
  }
  
  container.innerHTML = '';
  const grid = document.createElement('div');
  grid.className = 'rhyme-grid';
  
  data.slice(0, 40).forEach(r => {
    const tag = document.createElement('div');
    tag.className = 'rhyme-tag-v2';
    tag.innerHTML = `
      <span class="rhyme-word-text">${r.word}</span>
      <span class="rhyme-syl-badge">${r.syllables}</span>
    `;
    tag.onclick = () => insertRhyme(r.word);
    
    // Add collect on right-click or long-press
    tag.oncontextmenu = (e) => {
      e.preventDefault();
      addToScratchPad(r.word);
      tag.classList.add('collected');
      setTimeout(() => tag.classList.remove('collected'), 600);
    };
    
    grid.appendChild(tag);
  });
  
  container.appendChild(grid);
  
  // Show count
  const countEl = document.createElement('div');
  countEl.className = 'rhyme-count';
  countEl.textContent = data.length + ' ' + (data.length === 1 ? t('rhyme.result') : t('rhyme.results'));
  container.appendChild(countEl);
}

function insertRhyme(word) {
  if (selectedLine === null) return;
  const input = document.querySelectorAll('.line-input')[selectedLine];
  if (!input) return;
  const parts = input.value.trim().split(/\s+/);
  if (parts.length > 0) parts[parts.length - 1] = word;
  input.value = parts.join(' ') + ' ';
  sections[current].lines[selectedLine] = input.value;
  input.dispatchEvent(new Event('input'));
  input.focus();
}

function addSection() {
  const promptText = typeof t === 'function' ? t('section.add.prompt') : 'Section name:';
  const defaultText = typeof t === 'function' ? t('section.add.default') : 'Bridge 2';
  const name = prompt(promptText, defaultText);
  if (!name?.trim()) return;
  const badge = name.length > 7 ? name.slice(0,6).trim() + '…' : name;
  sections.push({ name: name.trim(), badge, lines:['','',''], sources:['human','human','human'] });
  renderSidebar();
  selectSection(sections.length - 1);
}

// ── Meta editing ──────────────────────────────────
function editMeta(type) {
  const id  = { key:'chipKey', tempo:'chipTempo', mood:'chipMood' };
  const pre = { key:'♩ ', tempo:'↯ ', mood:'◎ ' };
  const labels = { key:'Key', tempo:'Tempo (BPM)', mood:'Mood' };
  const current = document.getElementById(id[type])?.textContent?.replace(pre[type], '').trim() || '';

  // Remove existing
  document.getElementById('metaModal')?.remove();

  const modal = document.createElement('div');
  modal.id = 'metaModal';
  modal.style.cssText = 'position:fixed;inset:0;z-index:10002;display:flex;align-items:center;justify-content:center;background:rgba(26,21,16,0.35);backdrop-filter:blur(2px);';

  const box = document.createElement('div');
  box.style.cssText = 'background:var(--cream-light);border:1px solid var(--rule);border-radius:10px;padding:20px 22px;min-width:260px;box-shadow:0 16px 48px rgba(26,21,16,0.2);';

  const lbl = document.createElement('div');
  lbl.style.cssText = 'font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:10px;font-family:"DM Sans",sans-serif;';
  lbl.textContent = labels[type];

  const inp = document.createElement('input');
  inp.type = 'text';
  inp.value = current;
  inp.style.cssText = 'width:100%;background:none;border:none;border-bottom:2px solid var(--amber);padding:6px 2px;font-family:"Crimson Pro",serif;font-size:20px;color:var(--ink);outline:none;caret-color:var(--amber);';

  // Mood suggestions (persistent, user can add)
  let suggestions = null;
  if (type === 'mood') {
    const DEFAULT_MOODS = ['Melancholic','Hopeful','Anthemic','Bittersweet','Raw','Dreamy','Urgent','Tender','Dark','Playful'];
    const storedMoods = JSON.parse(localStorage.getItem('inkwell_moods') || 'null') || DEFAULT_MOODS;
    let moods = [...storedMoods];

    suggestions = document.createElement('div');
    suggestions.style.cssText = 'margin-top:12px;';

    function renderMoodTags() {
      suggestions.innerHTML = '';
      const cloud = document.createElement('div');
      cloud.style.cssText = 'display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px;';

      moods.forEach(m => {
        const tag = document.createElement('button');
        tag.textContent = m;
        const isActive = m === current;
        tag.style.cssText = 'padding:4px 11px;border:1px solid ' + (isActive ? 'var(--amber)' : 'var(--rule)') + ';border-radius:20px;background:' + (isActive ? 'var(--amber-pale)' : 'none') + ';font-size:11.5px;color:' + (isActive ? 'var(--amber)' : 'var(--ink-soft)') + ';cursor:pointer;font-family:"DM Sans",sans-serif;position:relative;';

        tag.onmouseenter = () => { tag.style.borderColor='var(--amber)'; tag.style.color='var(--amber)'; };
        tag.onmouseleave = () => { if (inp.value !== m) { tag.style.borderColor=isActive?'var(--amber)':'var(--rule)'; tag.style.color=isActive?'var(--amber)':'var(--ink-soft)'; } };
        tag.onclick = () => { inp.value = m; save(); };
        cloud.appendChild(tag);
      });

      // Add new mood row
      const addRow = document.createElement('div');
      addRow.style.cssText = 'display:flex;gap:6px;align-items:center;border-top:1px solid var(--rule);padding-top:10px;';

      const addInp = document.createElement('input');
      addInp.type = 'text';
      addInp.placeholder = 'Add a mood…';
      addInp.style.cssText = 'flex:1;background:none;border:none;border-bottom:1px solid var(--rule);padding:4px 2px;font-family:"DM Sans",sans-serif;font-size:12px;color:var(--ink);outline:none;caret-color:var(--amber);';

      const addBtn = document.createElement('button');
      addBtn.textContent = '+ Add';
      addBtn.style.cssText = 'padding:4px 10px;background:none;border:1px solid var(--rule);border-radius:20px;font-size:11px;color:var(--ink-soft);cursor:pointer;font-family:"DM Sans",sans-serif;flex-shrink:0;';
      addBtn.onmouseenter = () => { addBtn.style.borderColor='var(--amber)'; addBtn.style.color='var(--amber)'; };
      addBtn.onmouseleave = () => { addBtn.style.borderColor='var(--rule)'; addBtn.style.color='var(--ink-soft)'; };

      function addMood() {
        const val = addInp.value.trim();
        if (!val || moods.includes(val)) { addInp.focus(); return; }
        moods.push(val);
        localStorage.setItem('inkwell_moods', JSON.stringify(moods));
        inp.value = val;
        renderMoodTags();
        // Highlight the new tag
        addInp.value = '';
      }

      addBtn.onclick = addMood;
      addInp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.stopPropagation(); addMood(); } });

      addRow.appendChild(addInp);
      addRow.appendChild(addBtn);
      suggestions.appendChild(cloud);
      suggestions.appendChild(addRow);
    }

    renderMoodTags();
  }

  const row = document.createElement('div');
  row.style.cssText = 'display:flex;gap:8px;margin-top:14px;';

  const saveBtn = document.createElement('button');
  saveBtn.textContent = t('meta.btn.set');
  saveBtn.style.cssText = 'flex:1;padding:8px;background:var(--ink);color:var(--cream);border:none;border-radius:6px;font-family:"DM Sans",sans-serif;font-size:13px;cursor:pointer;';
  saveBtn.onmouseenter = () => saveBtn.style.background = 'var(--amber)';
  saveBtn.onmouseleave = () => saveBtn.style.background = 'var(--ink)';

  const cancelBtn = document.createElement('button');
  cancelBtn.textContent = t('meta.btn.cancel');
  cancelBtn.style.cssText = 'padding:8px 14px;background:none;border:1px solid var(--rule);border-radius:6px;font-family:"DM Sans",sans-serif;font-size:13px;color:var(--ink-soft);cursor:pointer;';
  cancelBtn.onclick = () => modal.remove();

  function save() {
    const val = inp.value.trim();
    if (val) document.getElementById(id[type]).textContent = pre[type] + val;
    modal.remove();
  }

  saveBtn.onclick = save;
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') save(); if (e.key === 'Escape') modal.remove(); });

  row.appendChild(saveBtn);
  row.appendChild(cancelBtn);
  box.appendChild(lbl);
  box.appendChild(inp);
  if (suggestions) box.appendChild(suggestions);
  box.appendChild(row);
  modal.appendChild(box);
  modal.addEventListener('click', e => { if (e.target === modal) modal.remove(); });
  document.body.appendChild(modal);
  setTimeout(() => inp.focus(), 50);
}

function toggleExportMenu() {

    menu.style.display = 'block';

function exportLyrics(fmt) {
  document.getElementById('exportMenu').style.display = 'none';
  const title = document.getElementById('songTitle').value || 'Untitled Song';
  const slug  = title.replace(/[^a-z0-9]/gi, '_');

  if (fmt === 'md') {
    let out = '# ' + title + '\n\n';
    const key   = document.getElementById('chipKey')?.textContent?.trim() || '';
    const tempo = document.getElementById('chipTempo')?.textContent?.trim() || '';
    const mood  = document.getElementById('chipMood')?.textContent?.trim() || '';
    if (key || tempo || mood) out += '> ' + [key, tempo, mood].filter(Boolean).join(' · ') + '\n\n';
    sections.forEach(sec => {
      const lines = sec.lines.filter(l => l.trim());
      if (lines.length) out += '## ' + sec.name + '\n\n' + lines.join('  \n') + '\n\n';
    });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([out], { type: 'text/markdown' }));
    a.download = slug + '.md';
    a.click();

  } else if (fmt === 'pdf') {
    const win = window.open('', '_blank');
    const key   = document.getElementById('chipKey')?.textContent?.trim() || '';
    const tempo = document.getElementById('chipTempo')?.textContent?.trim() || '';
    const mood  = document.getElementById('chipMood')?.textContent?.trim() || '';
    let body = '';
    sections.forEach(sec => {
      const lines = sec.lines.filter(l => l.trim());
      if (lines.length) body += '<h3>' + sec.name + '</h3><p>' + lines.join('<br>') + '</p>';
    });
    win.document.write(
      '<!DOCTYPE html><html><head><title>' + title + '</title>' +
      '<style>body{font-family:Georgia,serif;max-width:600px;margin:60px auto;color:#1a1510;line-height:1.8}h1{font-size:28px;font-weight:normal;margin-bottom:4px}.meta{color:#7a6d5e;font-size:13px;margin-bottom:36px;font-style:italic}h3{font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#b8a99a;margin:28px 0 8px}p{margin:0;font-size:18px}</style>' +
      '</head><body><h1>' + title + '</h1>' +
      '<div class="meta">' + [key,tempo,mood].filter(Boolean).join(' - ') + '</div>' +
      body + '</body></html>'
    );
    win.document.close();
    win.focus();
    setTimeout(() => win.print(), 400);

  } else {
    // Plain text (default)
    let out = title.toUpperCase() + '\n' + '─'.repeat(title.length) + '\n\n';
    sections.forEach(sec => {
      const lines = sec.lines.filter(l => l.trim());
      if (lines.length) out += '[' + sec.name.toUpperCase() + ']\n' + lines.join('\n') + '\n\n';
    });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([out], { type: 'text/plain' }));
    a.download = slug + '.txt';
    a.click();
  }
}

// ── Scratch Pad ───────────────────────────────────
let scratchOpen = false;

function getScratchPad() {
  const songId = currentSongId || 'default';
  try {
    const all = JSON.parse(localStorage.getItem('inkwell_scratch') || '{}');
    return all[songId] || [];
  } catch(e) { return []; }
}

function saveScratchPad(items) {
  const songId = currentSongId || 'default';
  try {
    const all = JSON.parse(localStorage.getItem('inkwell_scratch') || '{}');
    all[songId] = items;
    localStorage.setItem('inkwell_scratch', JSON.stringify(all));
  } catch(e) {}
}

function isCollected(text) {
  return getScratchPad().some(item => item.text === text);
}

function toggleCollect(text) {
  const items = getScratchPad();
  const idx = items.findIndex(item => item.text === text);
  if (idx >= 0) {
    items.splice(idx, 1);
  } else {
    items.push({ text, addedAt: new Date().toISOString() });
    // Auto-expand when adding
    if (!scratchOpen) {
      scratchOpen = true;
      document.getElementById('scratchBody').style.display = 'block';
      document.getElementById('scratchToggle').classList.add('open');
    }
  }
  saveScratchPad(items);
  renderScratchPad();
}

function addToScratchPad(text) {
  if (isCollected(text)) return;
  const items = getScratchPad();
  items.push({ text, addedAt: new Date().toISOString() });
  saveScratchPad(items);
  renderScratchPad();
  // Auto-expand when adding
  if (!scratchOpen) {
    scratchOpen = true;
    document.getElementById('scratchBody').style.display = 'block';
    document.getElementById('scratchToggle').classList.add('open');
  }
}

function removeFromScratchPad(text) {
  const items = getScratchPad().filter(item => item.text !== text);
  saveScratchPad(items);
  renderScratchPad();
}

function toggleScratchPad() {
  scratchOpen = !scratchOpen;
  const body = document.getElementById('scratchBody');
  const toggle = document.getElementById('scratchToggle');
  body.style.display = scratchOpen ? 'block' : 'none';
  toggle.classList.toggle('open', scratchOpen);
  if (scratchOpen) renderScratchPad();
}

function renderScratchPad() {
  const items = getScratchPad();
  const count = document.getElementById('scratchCount');
  const empty = document.getElementById('scratchEmpty');
  const list = document.getElementById('scratchItems');
  
  count.textContent = items.length;
  count.classList.toggle('has-items', items.length > 0);
  
  if (items.length === 0) {
    empty.style.display = 'block';
    empty.textContent = t('scratch.empty');
    list.innerHTML = '';
    return;
  }
  
  empty.style.display = 'none';
  list.innerHTML = '';
  
  items.forEach((item, idx) => {
    const div = document.createElement('div');
    div.className = 'scratch-item';
    div.draggable = true;
    div.dataset.text = item.text;
    
    const textSpan = document.createElement('div');
    textSpan.className = 'scratch-item-text';
    textSpan.textContent = item.text;
    
    const actions = document.createElement('div');
    actions.className = 'scratch-item-actions';
    
    const insertBtn = document.createElement('button');
    insertBtn.className = 'scratch-item-btn';
    insertBtn.textContent = t('scratch.insert');
    insertBtn.onclick = (e) => {
      e.stopPropagation();
      insertFromScratch(item.text);
    };
    
    const deleteBtn = document.createElement('button');
    deleteBtn.className = 'scratch-item-btn delete';
    deleteBtn.textContent = t('scratch.delete');
    deleteBtn.onclick = (e) => {
      e.stopPropagation();
      removeFromScratchPad(item.text);
    };
    
    actions.appendChild(insertBtn);
    actions.appendChild(deleteBtn);
    div.appendChild(textSpan);
    div.appendChild(actions);
    
    // Drag handlers
    div.addEventListener('dragstart', (e) => {
      e.dataTransfer.setData('text/plain', item.text);
      e.dataTransfer.effectAllowed = 'copy';
      div.classList.add('dragging');
    });
    div.addEventListener('dragend', () => {
      div.classList.remove('dragging');
    });
    
    list.appendChild(div);
  });
}

function insertFromScratch(text) {
  if (selectedLine === null) {
    // No line selected — show modal to choose where
    showUseModal(text);
  } else {
    // Line selected — insert below
    snapshot();
    const sec = sections[current];
    if (!sec.sources) sec.sources = sec.lines.map(() => 'human');
    sec.lines.splice(selectedLine + 1, 0, text);
    sec.sources.splice(selectedLine + 1, 0, 'ai');
    renderEditor();
    focusLine(selectedLine + 1);
    updateLineCounts();
    renderOverview();
  }
}

// Initialize scratch pad on load
(function initScratchPad() {
  setTimeout(() => {
    renderScratchPad();
    // Set initial title
    const title = document.getElementById('scratchTitle');
    if (title) title.textContent = t('scratch.title');
  }, 100);
})();

// ── Song Library ──────────────────────────────────
let currentSongId = null;

function getSongLibrary() {
  try {
    return JSON.parse(localStorage.getItem('inkwell_songs') || '{}');
  } catch(e) { return {}; }
}

function saveSongLibrary(lib) {
  localStorage.setItem('inkwell_songs', JSON.stringify(lib));
}

function generateSongId() {
  return 'song_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
}

function getCurrentSongData() {
  return {
    title: document.getElementById('songTitle').value || t('song.untitled'),
    sections: sections,
    key: document.getElementById('chipKey')?.textContent || '',
    tempo: document.getElementById('chipTempo')?.textContent || '',
    mood: document.getElementById('chipMood')?.textContent || '',
    updatedAt: new Date().toISOString()
  };
}

function saveSongToLibrary() {
  const lib = getSongLibrary();
  if (!currentSongId) {
    currentSongId = generateSongId();
  }
  lib[currentSongId] = getCurrentSongData();
  saveSongLibrary(lib);
  localStorage.setItem('inkwell_current_song_id', currentSongId);
  
  // Visual feedback
  const btn = document.getElementById('saveBtn');
  btn.textContent = t('btn.saved');
  setTimeout(() => btn.textContent = t('btn.save'), 1600);
}

function loadSongFromLibrary(songId) {
  const lib = getSongLibrary();
  const song = lib[songId];
  if (!song) return;
  
  currentSongId = songId;
  localStorage.setItem('inkwell_current_song_id', songId);
  
  document.getElementById('songTitle').value = song.title || '';
  if (song.sections?.length) sections = song.sections;
  if (song.key) document.getElementById('chipKey').textContent = song.key;
  if (song.tempo) document.getElementById('chipTempo').textContent = song.tempo;
  if (song.mood) document.getElementById('chipMood').textContent = song.mood;
  
  renderSidebar();
  selectSection(0);
  closeSongPicker();
}

function createNewSong() {
  // Save current song first
  if (currentSongId) {
    const lib = getSongLibrary();
    lib[currentSongId] = getCurrentSongData();
    saveSongLibrary(lib);
  }
  
  // Reset to new song
  currentSongId = generateSongId();
  localStorage.setItem('inkwell_current_song_id', currentSongId);
  
  document.getElementById('songTitle').value = '';
  sections = [
    { name: t('section.verse1'), lines: ['', '', '', ''], sources: ['human','human','human','human'] },
    { name: t('section.prechorus'), lines: ['', ''], sources: ['human','human'] },
    { name: t('section.chorus'), lines: ['', '', '', ''], sources: ['human','human','human','human'] },
    { name: t('section.verse2'), lines: ['', '', '', ''], sources: ['human','human','human','human'] },
    { name: t('section.bridge'), lines: ['', ''], sources: ['human','human'] },
    { name: t('section.outro'), lines: ['', ''], sources: ['human','human'] },
  ];
  current = 0;
  
  renderSidebar();
  selectSection(0);
  closeSongPicker();
}

function deleteSong(songId, e) {
  e.stopPropagation();
  const lib = getSongLibrary();
  const song = lib[songId];
  if (!song) return;
  
  const title = song.title || t('song.untitled');
  if (!confirm(t('song.delete.confirm').replace('{title}', title))) return;
  
  delete lib[songId];
  saveSongLibrary(lib);
  
  // If deleting current song, create new one
  if (songId === currentSongId) {
    const remaining = Object.keys(lib);
    if (remaining.length) {
      loadSongFromLibrary(remaining[0]);
    } else {
      createNewSong();
    }
  }
  
  renderSongPicker();
}

function toggleSongPicker() {
  const dropdown = document.getElementById('songPickerDropdown');
  if (dropdown.style.display === 'none') {
    renderSongPicker();
    dropdown.style.display = 'block';
    setTimeout(() => document.addEventListener('click', closeSongPickerOutside, { once: true }), 10);
  } else {
    closeSongPicker();
  }
}

function closeSongPicker() {
  document.getElementById('songPickerDropdown').style.display = 'none';
}

function closeSongPickerOutside(e) {
  const wrap = document.querySelector('.song-picker-wrap');
  if (wrap && !wrap.contains(e.target)) {
    closeSongPicker();
  }
}

function renderSongPicker() {
  const dropdown = document.getElementById('songPickerDropdown');
  const lib = getSongLibrary();
  const songs = Object.entries(lib).sort((a, b) => 
    new Date(b[1].updatedAt || 0) - new Date(a[1].updatedAt || 0)
  );
  
  let html = `
    <div style="padding:10px 14px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;align-items:center;">
      <span style="font-family:'Cormorant Garamond',serif;font-size:13px;color:var(--ink-soft);letter-spacing:0.05em;">${t('song.library')}</span>
      <span style="font-size:11px;color:var(--ink-faint);">${songs.length} ${songs.length === 1 ? t('song.count.one') : t('song.count.many')}</span>
    </div>
    <div onclick="createNewSong()" style="padding:12px 14px;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:13px;color:var(--amber);display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--rule);" onmouseenter="this.style.background='var(--cream-dark)'" onmouseleave="this.style.background=''">
      ${t('song.new')}
    </div>
  `;
  
  songs.forEach(([id, song]) => {
    const isCurrent = id === currentSongId;
    const title = song.title || t('song.untitled');
    const date = song.updatedAt ? new Date(song.updatedAt).toLocaleDateString() : '';
    html += `
      <div onclick="loadSongFromLibrary('${id}')" style="padding:10px 14px;cursor:pointer;display:flex;align-items:center;gap:10px;${isCurrent ? 'background:var(--cream-dark);' : ''}" onmouseenter="this.style.background='var(--cream-dark)'" onmouseleave="this.style.background='${isCurrent ? 'var(--cream-dark)' : ''}'">
        <span style="font-size:14px;color:${isCurrent ? 'var(--amber)' : 'var(--ink-faint)'};">${isCurrent ? '●' : '○'}</span>
        <div style="flex:1;min-width:0;">
          <div style="font-family:'Crimson Pro',serif;font-size:15px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;${isCurrent ? 'font-weight:600;' : ''}">${title}</div>
          <div style="font-size:11px;color:var(--ink-faint);">${date}</div>
        </div>
        ${!isCurrent ? `<button onclick="deleteSong('${id}', event)" style="padding:4px 8px;background:none;border:1px solid var(--rule);border-radius:4px;font-size:10px;color:var(--ink-faint);cursor:pointer;" onmouseenter="this.style.borderColor='#c44';this.style.color='#c44'" onmouseleave="this.style.borderColor='var(--rule)';this.style.color='var(--ink-faint)'">${t('song.delete')}</button>` : ''}
      </div>
    `;
  });
  
  if (songs.length === 0) {
    html += `<div style="padding:20px;text-align:center;color:var(--ink-faint);font-size:13px;">${t('song.empty')}</div>`;
  }
  
  dropdown.innerHTML = html;
}

// Override saveSong to use library
saveSong = function() {
  saveSongToLibrary();
};

// On load, restore current song from library
(function initSongLibrary() {
  const savedId = localStorage.getItem('inkwell_current_song_id');
  const lib = getSongLibrary();
  
  // Migrate old single-song format to library
  const oldSong = localStorage.getItem('inkwell_song');
  if (oldSong && Object.keys(lib).length === 0) {
    try {
      const d = JSON.parse(oldSong);
      const id = generateSongId();
      lib[id] = {
        title: d.title || '',
        sections: d.sections || sections,
        updatedAt: new Date().toISOString()
      };
      saveSongLibrary(lib);
      currentSongId = id;
      localStorage.setItem('inkwell_current_song_id', id);
      localStorage.removeItem('inkwell_song'); // Clean up old format
    } catch(e) {}
  } else if (savedId && lib[savedId]) {
    currentSongId = savedId;
  } else if (Object.keys(lib).length > 0) {
    currentSongId = Object.keys(lib)[0];
  }
  
  if (currentSongId && lib[currentSongId]) {
    const song = lib[currentSongId];
    if (song.sections?.length) sections = song.sections;
  }
})();
