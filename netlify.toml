[build]
  command = "npm run build"
  publish = "netlify"
  functions = "netlify/functions"

# Firebase web API keys (AIza...) are intentionally client-visible — they
# identify the project, security is enforced via Firestore rules. Skip
# the scanner on the files that embed them.
[build.environment]
  SECRETS_SCAN_OMIT_PATHS = "public/translate.html,public/translations.js,netlify/translate.html,netlify/translations.js,netlify/index.html,public/index.html,netlify/functions/ai.js,netlify/functions/stripe-webhook.js,netlify/functions/verify-checkout.js"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# PostHog reverse proxy — bypasses ad blockers
[[redirects]]
  from = "/ingest/static/*"
  to = "https://us-assets.i.posthog.com/static/:splat"
  status = 200

[[redirects]]
  from = "/ingest/*"
  to = "https://us.i.posthog.com/:splat"
  status = 200

# French rhyme API proxy (drime.a3nm.net)
[[redirects]]
  from = "/rhyme-fr/*"
  to = "https://drime.a3nm.net/:splat"
  status = 200

# Never cache HTML — always fresh
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"

# No cache on JS either
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"
